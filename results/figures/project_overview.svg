   </g>
   <g id="text_37">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616e" x="43.2" y="591.975781" transform="rotate(-0 43.2 591.975781)">Leaderboard snapshot: 2026-10-11. Individual Private scores and selection flags are owner-maintained records.</text>
