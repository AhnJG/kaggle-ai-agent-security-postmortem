   <g id="text_38">
    <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616e" x="43.2" y="612.855781" transform="rotate(-0 43.2 612.855781)">Private scores were hidden during the contest. Benchmark outcomes do not establish effectiveness on real systems.</text>
